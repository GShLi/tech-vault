        password:
          type: string
          minLength: 8
        display_name:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResult:
      type: object
      required: [access_token, expires_in, user]
      properties:

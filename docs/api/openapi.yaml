        quality_flags:
          type: array
          items:
            type: string
        version:
          type: integer
        index_generation:
          type: string
          nullable: true
        updated_at:
          type: string
          format: date-time
    Conversation:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        knowledge_base_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: run_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Server-sent events
          content:
            text/event-stream:
              schema:
                type: string
  /ingestions/retry:
    post:
      tags:
      - ingestions
      summary: Retry an ingestion run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericBody'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /ingestions/cancel:
    post:
      tags:
      - ingestions
      summary: Cancel an ingestion run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericBody'
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /docs/tasks:
    get:
      tags:

name: techvault

x-backend-env: &backend-env
  TECHVAULT_ENVIRONMENT: development
  TECHVAULT_JWT_SECRET: local-development-secret-at-least-32-bytes
  TECHVAULT_ACCESS_TOKEN_TTL_SECONDS: "900"
  TECHVAULT_DATABASE_URL: postgresql+psycopg2://techvault:techvault@postgres:5432/techvault
  TECHVAULT_REDIS_URL: redis://redis:6379/0
  TECHVAULT_ES_URL: http://elasticsearch:9200
  TECHVAULT_QDRANT_URL: http://qdrant:6333
  TECHVAULT_MINIO_URL: http://minio:9000
  TECHVAULT_MINIO_PUBLIC_URL: http://127.0.0.1:59000
  TECHVAULT_MINIO_ACCESS_KEY: minioadmin
  TECHVAULT_MINIO_SECRET_KEY: minioadmin
  TECHVAULT_MINIO_BUCKET: techvault
  TECHVAULT_EMBEDDING_URL: http://embedding:8001
  TECHVAULT_RERANK_URL: http://embedding:8001
  TECHVAULT_UPLOAD_DIR: /data/uploads
  TECHVAULT_ADMIN_EMAIL: admin@techvault.local
  TECHVAULT_ADMIN_PASSWORD: ChangeMe-123!
  TECHVAULT_ADMIN_DISPLAY_NAME: TechVault Admin
  TECHVAULT_ENABLE_INDEXING: "true"
  TECHVAULT_OBJECT_STORAGE_ENABLED: "true"
  TECHVAULT_DOCUMENT_RETENTION_DAYS: "7"

services:
  postgres:
    image: lm2kjj4pk1kreo.xuanyuan.run/pgvector/pgvector:pg16
    container_name: techvault-postgres
    environment:
      POSTGRES_USER: techvault
      POSTGRES_PASSWORD: techvault
      POSTGRES_DB: techvault
    ports:
      - "55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techvault -d techvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: lm2kjj4pk1kreo.xuanyuan.run/library/redis:7
    container_name: techvault-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: lm2kjj4pk1kreo.xuanyuan.run/library/elasticsearch:8.13.4
    container_name: techvault-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - cluster.name=techvault
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "59200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  qdrant:
    image: lm2kjj4pk1kreo.xuanyuan.run/qdrant/qdrant:v1.12.4
    container_name: techvault-qdrant
    ports:
      - "56333:6333"
      - "56334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  minio:
    image: lm2kjj4pk1kreo.xuanyuan.run/minio/minio:latest
    container_name: techvault-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio-init:
    image: lm2kjj4pk1kreo.xuanyuan.run/minio/mc:latest
    container_name: techvault-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/techvault &&
      echo 'minio bucket ready'
      "

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: techvault-backend
    profiles: ["app"]
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - upload-data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    restart: unless-stopped

  celery-worker:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: techvault-celery-worker
    profiles: ["app"]
    command: ["celery", "-A", "backend.app.workers.tasks", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      <<: *backend-env
    volumes:
      - upload-data:/data/uploads
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: techvault-celery-beat
    profiles: ["app"]
    command: ["celery", "-A", "backend.app.workers.tasks", "beat", "--loglevel=info"]
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  flower:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    container_name: techvault-flower
    profiles: ["app"]
    command: ["celery", "-A", "backend.app.workers.tasks", "flower", "--port=5555"]
    environment:
      <<: *backend-env
    ports:
      - "5555:5555"
    depends_on:
      celery-worker:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped

  embedding:
    build:
      context: ..
      dockerfile: deploy/embedding.Dockerfile
    container_name: techvault-embedding
    profiles: ["ml"]
    ports:
      - "58001:8001"
    volumes:
      - model-cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    container_name: techvault-frontend
    profiles: ["app"]
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  es-data:
  qdrant-data:
  minio-data:
  upload-data:
  model-cache:

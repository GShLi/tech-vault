        chunk_id:
          type: string
        document_id:
          type: string
        document_name:
          type: string
        page_no:
          type: integer
          nullable: true
        heading_path:
          type: array
          items:
            type: string
        source_url:
          type: string
        excerpt:
          type: string
        support_score:
          type: number
          format: float
    RetrievalTrace:
      type: object

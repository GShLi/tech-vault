components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Meta:
      type: object
      required:
      - request_id
      properties:
        request_id:
          type: string
    PageMeta:
      allOf:
      - $ref: '#/components/schemas/Meta'
      - type: object
        properties:
          next_cursor:
            type: string
            nullable: true
          has_more:
            type: boolean
    Envelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          additionalProperties: true
        meta:
          $ref: '#/components/schemas/PageMeta'
    ListEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PageMeta'
    TeamListEnvelope:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Team'
    KnowledgeBaseListEnvelope:
      allOf:
      - $ref: '#/components/schemas/ListEnvelope'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/KnowledgeBase'
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
            request_id:
              type: string
    GenericBody:
      type: object
      additionalProperties: true
    MultipartBody:
      type: object
      additionalProperties: true
      properties:
        team_id:
          type: string
        kb_id:
          type: string
        file:
          type: string
          format: binary
        metadata:
          type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        display_name:
          type: string
        status:
          type: string
        is_super_admin:
          type: boolean
        is_builtin:
          type: boolean
        created_at:
          type: string
          format: date-time
    Team:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    KnowledgeBase:
      type: object
      properties:
        id:
          type: string
        team_id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        default_model_policy_mode:
          $ref: '#/components/schemas/ModelPolicyMode'
        document_count:
          type: integer
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Document:
      type: object
      properties:
        id:
          type: string
        knowledge_base_id:
          type: string
        owner_user_id:
          type: string
        file_name:
          type: string
        product:
          type: string
          nullable: true
        version_values:
          type: array
          items:
            type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        data_classification:
          $ref: '#/components/schemas/DataClassification'
        doc_status:
          $ref: '#/components/schemas/DocumentStatus'
        version:
          type: integer
    Chunk:
      type: object
      properties:
        id:
          type: string
        document_id:
          type: string
        document_version_id:
          type: string
        content:
          type: string
        heading_path:
          type: array
          items:
            type: string
        source_locator:
          type: object
          additionalProperties: true
        status:
          $ref: '#/components/schemas/ChunkStatus'
        quality_flags:
          type: array
          items:
            type: string
        version:
          type: integer
        index_generation:
          type: string
          nullable: true
    Chat:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        knowledge_base_ids:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
    Message:
      type: object
      properties:
        id:
          type: string
        chat_id:
          type: string
        role:
          type: string
          enum:
          - user
          - assistant
        content:
          type: string
        status:
          $ref: '#/components/schemas/MessageStatus'
        trace_id:
          type: string
          nullable: true
        citation_ids:
          type: array
          items:
            type: string
        refusal_reason:
          type: string
          nullable: true
    Citation:
      type: object
      properties:
        citation_id:
          type: string
        chunk_id:
          type: string
        document_id:
          type: string
        document_name:
          type: string
        page_no:
          type: integer
          nullable: true
        heading_path:
          type: array
          items:
            type: string
        source_url:
          type: string
        excerpt:
          type: string
        support_score:
          type: number
          format: float
    RetrievalCandidate:
      type: object
      properties:
        chunk_id:
          type: string
        rank:
          type: integer
        score:
          type: number
          format: float
        source:
          type: string
          enum:
          - bm25
          - dense
          - rrf
          - rerank
    RetrievalTrace:
      type: object
      properties:
        trace_id:
          type: string
        message_id:
          type: string
        engine_mode:
          $ref: '#/components/schemas/EngineMode'
        original_query:
          type: string
        rewritten_query:
          type: string
          nullable: true
        filters:
          type: object
          additionalProperties: true
        bm25_candidates:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalCandidate'
        dense_candidates:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalCandidate'
        rrf_candidates:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalCandidate'
        rerank_candidates:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalCandidate'
        final_context:
          type: array
          items:
            $ref: '#/components/schemas/Chunk'
        stage_latency_ms:
          type: object
          additionalProperties:
            type: number
        degraded:
          type: boolean
        error_code:
          type: string
          nullable: true
        model:
          type: object
          additionalProperties: true
    EvaluationDataset:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        case_count:
          type: integer
        version:
          type: integer
    EvaluationRun:
      type: object
      properties:
        id:
          type: string
        dataset_id:
          type: string
        engine_mode:
          $ref: '#/components/schemas/EngineMode'
        status:
          $ref: '#/components/schemas/EvaluationStatus'
        baseline_run_id:
          type: string
          nullable: true
    ModelPolicy:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/ModelPolicyMode'
        allowed_provider_ids:
          type: array
          items:
            type: string
        max_data_classification:
          $ref: '#/components/schemas/DataClassification'
        allow_chat_history:
          type: boolean
        allow_document_metadata:
          type: boolean
        require_redaction:
          type: boolean
        version:
          type: integer
    IndexGeneration:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
          enum:
          - staging
          - validating
          - active
          - failed
          - cleaning
        chunk_count:
          type: integer
        embedding_model:
          type: string
        created_at:
          type: string
          format: date-time
    Role:
      type: string
      enum:
      - admin
      - leader
      - member
      - viewer
    Visibility:
      type: string
      enum:
      - private
      - team_shared
    DataClassification:
      type: string
      enum:
      - public
      - internal
      - private
      - restricted
    DocumentStatus:
      type: string
      enum:
      - active
      - building
      - deleting
      - deleted
      - failed
    ChunkStatus:
      type: string
      enum:
      - enabled
      - disabled
    IngestionStatus:
      type: string
      enum:
      - queued
      - fetching
      - parsing
      - chunking
      - embedding
      - indexing
      - validating
      - active
      - failed
      - deleting
      - cancelled
    MessageStatus:
      type: string
      enum:
      - generating
      - completed
      - refused
      - cancelled
      - failed
    EngineMode:
      type: string
      enum:
      - dual_engine
      - elastic_single
    EvaluationStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
      - cancelled
    ModelPolicyMode:
      type: string
      enum:
      - local_only
      - external_allowed
      - external_required

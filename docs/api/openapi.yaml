        dense_candidates:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalCandidate'
        rrf_candidates:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalCandidate'
        rerank_candidates:
          type: array
          items:
            $ref: '#/components/schemas/RetrievalCandidate'
        final_context:

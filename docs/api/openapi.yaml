openapi: 3.0.3
info:
  title: TechVault API
  version: 0.1.0
  description: |
    TechVault P0 API contract. The Markdown contract in
    `docs/api/api-contract.md` is the integration guide; this file is the
    machine-readable baseline for generated clients and mocks.
servers:
  - url: /api/v1
    description: Versioned API
tags:
  - name: auth
  - name: teams
  - name: knowledge-bases
  - name: documents
  - name: ingestion
  - name: chunks
  - name: conversations
  - name: traces
  - name: evaluations
  - name: model-policies
  - name: index-generations
security:
  - bearerAuth: []
paths:
  /auth/register:
    post:
      tags: [auth]
      security: []
      summary: Register a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/login:
    post:
      tags: [auth]
      security: []
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token and current user
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh an access token
      responses:
        '200':
          description: New access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      expires_in:
                        type: integer
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/logout:
    post:
      tags: [auth]
      summary: Log out
      responses:
        '204':
          description: Logged out
        default:
          $ref: '#/components/responses/ErrorResponse'
  /auth/me:
    get:
      tags: [auth]
      summary: Current user and memberships
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams:
    get:
      tags: [teams]
      summary: List current user's teams
      responses:
        '200':
          description: Team list
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          $ref: '#/components/responses/TeamResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      summary: Get team
      responses:
        '200':
          $ref: '#/components/responses/TeamResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [teams]
      summary: Update team
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/TeamResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/members:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [teams]
      summary: List team members
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamMember'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/knowledge-bases:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [knowledge-bases]
      summary: List knowledge bases
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeBaseListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [knowledge-bases]
      summary: Create a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
                model_policy_mode:
                  $ref: '#/components/schemas/ModelPolicyMode'
      responses:
        '201':
          $ref: '#/components/responses/KnowledgeBaseResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/knowledge-bases/{kb_id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/KbId'
    get:
      tags: [knowledge-bases]
      summary: Get a knowledge base
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeBaseResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [knowledge-bases]
      summary: Update a knowledge base
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/KnowledgeBaseResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/knowledge-bases/{kb_id}/documents:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/KbId'
    get:
      tags: [documents]
      summary: List documents in a knowledge base
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DocumentStatus'
      responses:
        '200':
          $ref: '#/components/responses/DocumentListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/knowledge-bases/{kb_id}/documents/upload:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/KbId'
    post:
      tags: [documents]
      summary: Upload a document
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, metadata]
              properties:
                file:
                  type: string
                  format: binary
                metadata:
                  type: string
                  description: JSON object encoded as a string
      responses:
        '202':
          description: Document and ingestion run accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      document:
                        $ref: '#/components/schemas/Document'
                      ingestion_run:
                        $ref: '#/components/schemas/IngestionRun'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/documents/{document_id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      summary: Get a document
      responses:
        '200':
          $ref: '#/components/responses/DocumentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [documents]
      summary: Update document metadata or access
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: string
                version_values:
                  type: array
                  items:
                    type: string
                visibility:
                  $ref: '#/components/schemas/Visibility'
                data_classification:
                  $ref: '#/components/schemas/DataClassification'
      responses:
        '200':
          $ref: '#/components/responses/DocumentResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags: [documents]
      summary: Soft-delete a document
      responses:
        '202':
          description: Deletion accepted
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/documents/{document_id}/versions:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/DocumentId'
    get:
      tags: [documents]
      summary: List document versions
      responses:
        '200':
          description: Version list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DocumentVersion'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/knowledge-bases/{kb_id}/sources/github:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/KbId'
    post:
      tags: [documents]
      summary: Add a GitHub source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [repo_url, branch]
              properties:
                repo_url:
                  type: string
                branch:
                  type: string
                path_allowlist:
                  type: array
                  items:
                    type: string
                file_extensions:
                  type: array
                  items:
                    type: string
                credential_id:
                  type: string
                  nullable: true
      responses:
        '202':
          description: Source connection and ingestion run accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      source_id:
                        type: string
                      ingestion_run:
                        $ref: '#/components/schemas/IngestionRun'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/ingestion-runs:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [ingestion]
      summary: List ingestion runs
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Ingestion run list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IngestionRun'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/ingestion-runs/{run_id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [ingestion]
      summary: Get an ingestion run
      responses:
        '200':
          $ref: '#/components/responses/IngestionRunResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/ingestion-runs/{run_id}/events:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: run_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [ingestion]
      summary: Stream ingestion progress
      responses:
        '200':
          description: Server-sent events
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/chunks:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [chunks]
      summary: List chunks
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: document_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ChunkStatus'
      responses:
        '200':
          description: Chunk list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Chunk'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/chunks/{chunk_id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: chunk_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [chunks]
      summary: Get a chunk
      responses:
        '200':
          $ref: '#/components/responses/ChunkResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [chunks]
      summary: Edit a chunk
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                status:
                  $ref: '#/components/schemas/ChunkStatus'
      responses:
        '200':
          $ref: '#/components/responses/ChunkResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/chunks/{chunk_id}/disable:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: chunk_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [chunks]
      summary: Disable a chunk
      responses:
        '200':
          $ref: '#/components/responses/ChunkResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/chunks/{chunk_id}/enable:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: chunk_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [chunks]
      summary: Enable a chunk
      responses:
        '200':
          $ref: '#/components/responses/ChunkResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/conversations:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [conversations]
      summary: List conversations
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Conversation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Conversation'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [conversations]
      summary: Create a conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                knowledge_base_ids:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          $ref: '#/components/responses/ConversationResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/conversations/{conversation_id}/messages:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/ConversationId'
    get:
      tags: [conversations]
      summary: List messages
      responses:
        '200':
          description: Message list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/conversations/{conversation_id}/ask:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/ConversationId'
    post:
      tags: [conversations]
      summary: Ask a grounded question and stream the answer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: Server-sent events. Events are defined in api-contract.md.
          content:
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/messages/{message_id}/feedback:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [conversations]
      summary: Submit feedback for a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  $ref: '#/components/schemas/FeedbackType'
                comment:
                  type: string
      responses:
        '201':
          description: Feedback accepted
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/traces:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [traces]
      summary: List retrieval traces
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Trace list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RetrievalTrace'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/traces/{trace_id}:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: trace_id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [traces]
      summary: Get a retrieval trace
      responses:
        '200':
          $ref: '#/components/responses/RetrievalTraceResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/evaluation-datasets:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [evaluations]
      summary: List golden sets
      responses:
        '200':
          description: Dataset list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvaluationDataset'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [evaluations]
      summary: Create a golden set
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Dataset created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EvaluationDataset'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/evaluation-runs:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [evaluations]
      summary: List evaluation runs
      responses:
        '200':
          description: Evaluation run list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvaluationRun'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags: [evaluations]
      summary: Start an evaluation run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dataset_id, engine_mode]
              properties:
                dataset_id:
                  type: string
                engine_mode:
                  $ref: '#/components/schemas/EngineMode'
                judge_mode:
                  type: string
                  enum: [rules, rules_and_manual, llm_as_judge]
                baseline_run_id:
                  type: string
                  nullable: true
      responses:
        '202':
          description: Evaluation run accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/EvaluationRun'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/model-policy:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [model-policies]
      summary: Get team model policy
      responses:
        '200':
          $ref: '#/components/responses/ModelPolicyResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags: [model-policies]
      summary: Tighten team model policy
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPolicy'
      responses:
        '200':
          $ref: '#/components/responses/ModelPolicyResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [model-policies]
      summary: List audit logs
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Audit log list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/index-generations:
    parameters:
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [index-generations]
      summary: List index generations
      responses:
        '200':
          description: Index generation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/IndexGeneration'
                  meta:
                    $ref: '#/components/schemas/Meta'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /teams/{team_id}/index-generations/{generation_id}/activate:
    parameters:
      - $ref: '#/components/parameters/TeamId'
      - name: generation_id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [index-generations]
      summary: Activate an index generation
      responses:
        '202':
          description: Activation accepted
        default:
          $ref: '#/components/responses/ErrorResponse'
  /users/me:
    patch:
      tags: [auth]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                display_name:
                  type: string
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'

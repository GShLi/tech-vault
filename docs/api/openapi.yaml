components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TeamId:
      name: team_id
      in: path
      required: true
      schema:
        type: string
    KbId:
      name: kb_id
      in: path
      required: true
      schema:
        type: string
    DocumentId:
      name: document_id
      in: path
      required: true
      schema:
        type: string
    ConversationId:
      name: conversation_id
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: message_id
      in: path
      required: true
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    GenericObjectResponse:
      description: Generic object response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                additionalProperties: true
              meta:
                $ref: '#/components/schemas/Meta'
    GenericListResponse:
      description: Generic list response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  additionalProperties: true
              meta:
                $ref: '#/components/schemas/PageMeta'
    InvitationResponse:
      description: Team invitation response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/Invitation'
              meta:
                $ref: '#/components/schemas/Meta'
    UserResponse:
      description: User response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/User'
              meta:
                $ref: '#/components/schemas/Meta'
    TeamResponse:
      description: Team response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/Team'
              meta:
                $ref: '#/components/schemas/Meta'
    KnowledgeBaseResponse:
      description: Knowledge base response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/KnowledgeBase'
              meta:
                $ref: '#/components/schemas/Meta'
    KnowledgeBaseListResponse:
      description: Knowledge base list
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeBase'
              meta:
                $ref: '#/components/schemas/PageMeta'
    DocumentResponse:
      description: Document response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/Document'
              meta:
                $ref: '#/components/schemas/Meta'
    DocumentListResponse:
      description: Document list
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Document'
              meta:
                $ref: '#/components/schemas/PageMeta'
    IngestionRunResponse:
      description: Ingestion run response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/IngestionRun'
              meta:
                $ref: '#/components/schemas/Meta'
    ChunkResponse:
      description: Chunk response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/Chunk'
              meta:
                $ref: '#/components/schemas/Meta'
    ConversationResponse:
      description: Conversation response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/Conversation'
              meta:
                $ref: '#/components/schemas/Meta'
    RetrievalTraceResponse:
      description: Retrieval trace response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/RetrievalTrace'
              meta:
                $ref: '#/components/schemas/Meta'
    ModelPolicyResponse:
      description: Model policy response
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: '#/components/schemas/ModelPolicy'
              meta:
                $ref: '#/components/schemas/Meta'
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
    PageMeta:
      allOf:
        - $ref: '#/components/schemas/Meta'
        - type: object
          properties:
            next_cursor:
              type: string
              nullable: true
            has_more:
              type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ApiError'
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
    RegisterRequest:

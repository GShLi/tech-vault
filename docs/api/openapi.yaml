openapi: 3.0.3
info:
  title: TechVault API
  version: 0.1.0
  description: TechVault P0 API contract. No path parameters; mutations use POST bodies.
servers:
- url: /api/v1
  description: Versioned API
tags:
- name: auth
- name: teams
- name: kbs
- name: docs
- name: ingestions
- name: chunks
- name: chats
- name: traces
- name: evals
- name: policies
- name: generations
- name: health
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - auth
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /admin/users:
    get:
      tags:
      - auth
      summary: List platform users
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserPageEnvelope'
  /admin/users/create:
    post:
      tags:
      - auth
      summary: Create a user and assign a team role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserCreateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /admin/users/update:
    post:
      tags:
      - auth
      summary: Update a user and team role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /auth/refresh:
    post:
      tags:
      - auth
      summary: Refresh an access token
      security: []
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Log out
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '204':
          description: No content
  /auth/me:
    get:
      tags:
      - auth
      summary: Current user and memberships
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /users/update:
    post:
      tags:
      - auth
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /auth/password/change:
    post:
      tags:
      - auth
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '204':
          description: No content
  /teams:
    get:
      tags:
      - teams
      summary: List current user teams
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamPageEnvelope'
  /teams/create:
    post:
      tags:
      - teams
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /teams/detail:
    get:
      tags:
      - teams
      summary: Get team
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /teams/update:
    post:
      tags:
      - teams
      summary: Update team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamUpdateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /members:
    get:
      tags:
      - teams
      summary: List team members
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMemberPageEnvelope'
  /invitations/create:
    post:
      tags:
      - teams
      summary: Invite a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /invitations/detail:
    get:
      tags:
      - teams
      summary: Read an invitation
      security: []
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /invitations/accept:
    post:
      tags:
      - teams
      summary: Accept an invitation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationAcceptBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /members/update:
    post:
      tags:
      - teams
      summary: Change a member role or status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberUpdateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /members/remove:
    post:
      tags:
      - teams
      summary: Remove a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberRemoveBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /members/transfer-documents:
    post:
      tags:
      - teams
      summary: Transfer a departing member's private documents
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferDocumentsBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /kbs:
    get:
      tags:
      - kbs
      summary: List knowledge bases
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBasePageEnvelope'
  /kbs/create:
    post:
      tags:
      - kbs
      summary: Create a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBaseCreateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /kbs/detail:
    get:
      tags:
      - kbs
      summary: Get a knowledge base
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: kb_id
        in: query
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /kbs/update:
    post:
      tags:
      - kbs
      summary: Update a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBaseUpdateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /kbs/archive:
    post:
      tags:
      - kbs
      summary: Archive or delete a knowledge base
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBaseArchiveBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /kbs/policy:
    get:
      tags:
      - kbs
      summary: Get knowledge-base model policy
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: kb_id
        in: query
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /kbs/policy/update:
    post:
      tags:
      - kbs
      summary: Tighten knowledge-base model policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBasePolicyUpdateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /kbs/members:
    get:
      tags:
      - kbs
      summary: List knowledge-base members
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: kb_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseMemberPageEnvelope'
  /kbs/members/update:
    post:
      tags:
      - kbs
      summary: Replace knowledge-base members
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeBaseMembersUpdateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeBaseMemberCollectionEnvelope'
  /facets:
    get:
      tags:
      - kbs
      summary: List product, version and source filter facets
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /docs:
    get:
      tags:
      - docs
      summary: List documents
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: kb_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentPageEnvelope'
  /docs/upload:
    post:
      tags:
      - docs
      summary: Upload a document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DocumentUploadBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /docs/detail:
    get:
      tags:
      - docs
      summary: Get a document
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: document_id
        in: query
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /docs/update:
    post:
      tags:
      - docs
      summary: Update document metadata or access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentUpdateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /docs/delete:
    post:
      tags:
      - docs
      summary: Soft-delete a document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentDeleteBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /docs/restore:
    post:
      tags:
      - docs
      summary: Restore a soft-deleted document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRestoreBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /docs/versions:
    get:
      tags:
      - docs
      summary: List document versions
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: document_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentVersionPageEnvelope'
  /docs/version:
    get:
      tags:
      - docs
      summary: Get a document version
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: document_id
        in: query
        required: true
        schema:
          type: string
      - name: version_id
        in: query
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /docs/download-url:
    get:
      tags:
      - docs
      summary: Create a short-lived download URL
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: document_id
        in: query
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /docs/download:
    get:
      tags:
      - docs
      summary: Download document source through the API
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: document_id
        in: query
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: Document source
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Document or source is unavailable
  /docs/rebuild:
    post:
      tags:
      - docs
      summary: Rebuild a document index
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentRebuildBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /docs/grants:
    get:
      tags:
      - docs
      summary: List explicit document grants
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: document_id
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentGrantPageEnvelope'
  /docs/grants/create:
    post:
      tags:
      - docs
      summary: Grant a user access to a private document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentGrantCreateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /docs/grants/revoke:
    post:
      tags:
      - docs
      summary: Revoke an explicit document grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentGrantRevokeBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /sources:
    get:
      tags:
      - docs
      summary: List sources in a knowledge base
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: kb_id
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceConnectionPageEnvelope'
  /sources/github/create:
    post:
      tags:
      - docs
      summary: Add a GitHub source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubSourceCreateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /sources/detail:
    get:
      tags:
      - docs
      summary: Get a source connection
      parameters:
      - name: team_id
        in: query
        required: true
        schema:
          type: string
      - name: source_id
        in: query
        required: true
        schema:
          type: string
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /sources/update:
    post:
      tags:
      - docs
      summary: Update a source connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitHubSourceUpdateBody'
      responses:
        default:
          $ref: '#/components/responses/ErrorResponse'
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
  /sources/delete:
    post:
      tags:

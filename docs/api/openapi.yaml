          type: string
          nullable: true
        file_name:
          type: string
        product:
          type: string
          nullable: true
        version_family:
          type: string
          nullable: true
        version_values:
          type: array
          items:
            type: string
        visibility:
          $ref: '#/components/schemas/Visibility'
        data_classification:
          $ref: '#/components/schemas/DataClassification'
        doc_status:
          $ref: '#/components/schemas/DocumentStatus'
        current_version_id:
          type: string
          nullable: true
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DocumentVersion:
      type: object
      properties:
        id:
          type: string
        document_id:
          type: string
        source_revision:
          type: string
          nullable: true
        content_hash:
          type: string
        parse_status:
          type: string
        index_generation:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    IngestionRun:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
        document_id:
          type: string
          nullable: true
        source_id:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/IngestionStatus'
        stage:
          type: string
        processed:
          type: integer
        total:
          type: integer
        percent:
          type: number
          format: float
        retryable:
          type: boolean
        error_code:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Chunk:
      type: object

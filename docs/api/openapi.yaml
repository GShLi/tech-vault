components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErrorResponse:
      description: Structured API error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Meta:
      type: object
      required:
      - request_id
      properties:
        request_id:
          type: string
    PageMeta:
      allOf:
      - $ref: '#/components/schemas/Meta'
      - type: object
        required:
        - next_cursor
        - has_more
        properties:
          next_cursor:
            type: string
            nullable: true
          has_more:
            type: boolean
    Envelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          oneOf:
          - type: object
            additionalProperties: true
          - type: array
            items: {}
        meta:
          $ref: '#/components/schemas/Meta'
    PageEnvelope:
      type: object
      required:
